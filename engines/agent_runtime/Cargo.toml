[package]
name = "agent_runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Experimental Agent runtime APIs for ReAct-style loops, tool registration, approval policies, skills, team workflows, and world-state integration."

[lib]
name = "agent_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
causal_core = { path = "../causal_core" }
llm_adapter = { path = "../llm_adapter" }
memory_core = { path = "../memory_core" }
world_state = { path = "../world_state" }
