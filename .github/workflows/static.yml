name: Deploy Wanxiang static demo

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "site/**"
      - "scripts/**"
      - "wanxiang_sdk/**"
      - "wanxiang_world/**"
      - "wanxiang_engine/**"
      - "wanxiang_core/**"
      - "wanxiang_brain/**"
      - "wanxiang_evolution/**"
      - "wanxiang_types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep pull-request validation isolated from production deployment runs.
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Generate real Rust simulation comparison
        run: |
          mkdir -p site/data
          cargo run --locked -p wanxiang_sdk --example web_demo_data -- 42 100 > site/data/demo.json
      - name: Validate generated JSON
        run: python -m json.tool site/data/demo.json > /dev/null
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/wanxiang-site.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/wanxiang-site.js
      - name: Test comparison payload validator
        run: python scripts/test-validate-web-demo.py
      - name: Validate generated comparison payload
        run: python scripts/validate-web-demo.py site/data/demo.json
      - name: Upload static website from site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
