name: Deploy Wanxiang static demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# gh-pages 分支部署：直接推分支（经典模式），Pages 从该分支构建
permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Generate real Rust simulation comparison
        run: |
          mkdir -p site/data
          cargo run --locked -p wanxiang_sdk --example web_demo_data -- 42 100 > site/data/demo.json
      - name: Validate generated JSON
        run: python -m json.tool site/data/demo.json > /dev/null
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/wanxiang-site.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/wanxiang-site.js
      - name: Validate generated comparison payload
        run: |
          python - <<'PY'
          import json
          with open("site/data/demo.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("generated_by") == "wanxiang_sdk::WorldModel"
          baseline = data["baseline"]
          altered = data["altered"]
          assert baseline["meta"]["seed"] == altered["meta"]["seed"] == data["scenario"]["seed"]
          assert baseline["meta"]["tick"] == altered["meta"]["tick"] == data["scenario"]["ticks"]
          assert baseline["rules"]["energy_density"] != altered["rules"]["energy_density"]
          assert isinstance(baseline["events"], list) and isinstance(altered["events"], list)
          print("Verified real SDK output for baseline and modified-rule trajectories.")
          PY
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
